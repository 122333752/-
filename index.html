<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

html{
    scroll-behavior:smooth;
}


body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #c8ecff,
        #d9f8e7
    );

    color:#355c5c;

    overflow-x:hidden;
}


/* 背景柔光 */

.light{

    position:fixed;

    width:500px;
    height:500px;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.45),
        transparent 70%
    );

    pointer-events:none;

    transform:translate(-50%,-50%);

    z-index:0;
}


/* 蒲公英 */

.dandelion{

    position:fixed;

    bottom:-100px;

    color:white;

    font-size:35px;

    opacity:.8;

    animation:
    fly linear infinite;

    z-index:0;

}


@keyframes fly{

    0%{

        transform:
        translateY(0)
        translateX(0)
        rotate(0deg);

        opacity:0;

    }


    20%{

        opacity:1;

    }


    100%{

        transform:
        translateY(-120vh)
        translateX(80px)
        rotate(360deg);

        opacity:0;

    }

}


/* 主体 */

.container{

    position:relative;

    z-index:2;

    max-width:900px;

    margin:auto;

    padding:80px 25px;

}


/* 首页 */

.hero{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

}


.avatar{

    width:150px;

    height:150px;

    border-radius:50%;

    background:
    rgba(255,255,255,.45);

    backdrop-filter:blur(15px);

    border:
    3px solid rgba(255,255,255,.7);

    box-shadow:
    0 20px 50px rgba(80,150,150,.2);

    margin-bottom:30px;

}


h1{

    font-size:48px;

    letter-spacing:8px;

    color:#345d62;

}


.subtitle{

    margin-top:20px;

    font-size:18px;

    color:#557d7b;

}



.scroll{

    margin-top:80px;

    animation:
    bounce 2s infinite;

}


@keyframes bounce{

    50%{
        transform:translateY(15px);
    }

}



/* 卡片 */

section{

    margin:80px 0;

}


.card{

    background:

    rgba(255,255,255,.45);

    backdrop-filter:
    blur(20px);

    border-radius:30px;

    padding:40px;

    box-shadow:

    0 20px 60px
    rgba(50,120,120,.12);

    border:

    1px solid rgba(255,255,255,.5);


    opacity:0;

    transform:translateY(40px);

    transition:.8s;

}


.card.show{

    opacity:1;

    transform:none;

}


h2{

    font-size:28px;

    margin-bottom:25px;

    color:#315e63;

}


/* 时间线 */


.timeline{

    border-left:
    3px solid rgba(80,150,150,.3);

    padding-left:30px;

}


.item{

    margin-bottom:40px;

    position:relative;

}


.item::before{

    content:"";

    width:15px;

    height:15px;

    background:white;

    border-radius:50%;

    position:absolute;

    left:-39px;

    top:5px;

}



/* 手机 */

@media(max-width:600px){

    h1{

        font-size:36px;

    }

    .card{

        padding:25px;

    }

}


</style>

</head>


<body>


<div class="light"></div>


<!-- 蒲公英 -->

<script>

for(let i=0;i<35;i++){

    let d=document.createElement("div");

    d.className="dandelion";

    d.innerHTML="✽";


    d.style.left=
    Math.random()*100+"vw";


    d.style.animationDuration=
    (8+Math.random()*12)+"s";


    d.style.animationDelay=
    Math.random()*10+"s";


    d.style.fontSize=
    (15+Math.random()*30)+"px";


    document.body.appendChild(d);

}

</script>



<div class="container">


<!-- 首页 -->


<div class="hero">


<div class="avatar"></div>


<h1>
你的名字
</h1>


<p class="subtitle">

这里填写一句个人介绍

</p>


<div class="scroll">

↓ Scroll

</div>


</div>



<!-- 关于 -->

<section>


<div class="card">


<h2>
About Me
</h2>


<p>

这里填写你的个人介绍。

<br><br>

你的兴趣、方向、技能等内容。

</p>


</div>


</section>



<!-- 经历 -->


<section>


<div class="card">


<h2>
Experience
</h2>


<div class="timeline">


<div class="item">

<h3>
2026
</h3>

<p>
经历内容待填写
</p>

</div>



<div class="item">

<h3>
2025
</h3>

<p>
经历内容待填写
</p>

</div>



<div class="item">

<h3>
2024
</h3>

<p>
经历内容待填写
</p>

</div>


</div>


</div>


</section>




<!-- 联系 -->


<section>


<div class="card">


<h2>
Contact
</h2>


<p>

Email：

<br><br>

Github：

<br><br>

其他联系方式：

</p>


</div>


</section>



</div>





<script>


// 滚动出现

const cards =
document.querySelectorAll(".card");


window.addEventListener(
"scroll",
()=>{

cards.forEach(card=>{


let top =
card.getBoundingClientRect().top;


if(top <
window.innerHeight-100){

card.classList.add("show");

}


});


});



// 鼠标光效


const light=
document.querySelector(".light");


document.addEventListener(
"mousemove",
e=>{

light.style.left=e.clientX+"px";

light.style.top=e.clientY+"px";


});



</script>


</body>
</html>
